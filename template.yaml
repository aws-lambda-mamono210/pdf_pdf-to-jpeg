---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Resources:
  PdfPdfToJpegFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: 'pdf-pdf-to-jpeg'
      Handler: 'app.lambda_function.lambda_handler'
      Runtime: 'python3.9'
      Timeout: '300'
      MemorySize: '1024'
      CodeUri: .
      Layers:
        - 'arn:aws:lambda:ap-northeast-1:808683561341:layer:aws-s3-utils-layer:15'
      Policies:
        - S3ReadPolicy:
            BucketName: 'shitadan'
        - S3WritePolicy:
            BucketName: 'shitadan'
      Environment:
        Variables:
          SOURCE_BUCKET: "shitadan"
          PDF_PREFIX: "aws/lambda/pdf/pdf-to-jpeg/pdf"
          JPEG_PREFIX: "aws/lambda/pdf/pdf-to-jpeg/jpeg"
