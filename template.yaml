---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Globals:
  Function:
    Runtime: 'python3.12'
    Timeout: '300'
    MemorySize: '1024'

Parameters:
  AwsS3UtilsLayerArn:
    Type: String
    Description: 'ARN of aws-s3-utils-layer'
  FunctionName:
    Type: String
    Description: 'Lambda function name (prod/stg)'
  ReleaseVersion:
    Type: String
    Description: 'Application release version'
  GitRevision:
    Type: String
    Description: 'Git commit revision'

Resources:
  PdfPdfToJpegFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Handler: 'app.lambda_function.lambda_handler'
      CodeUri: .
      AutoPublishAlias: 'live'
      AutoPublishAliasAllProperties: true
      Description: !Sub 'pdf-pdf-to-jpeg ${ReleaseVersion}'
      VersionDescription: !Sub 'release=${ReleaseVersion}, git=${GitRevision}'
      Environment:
        Variables:
          APP_VERSION: !Ref ReleaseVersion
          GIT_REVISION: !Ref GitRevision
      Tags:
        ReleaseVersion: !Ref ReleaseVersion
        GitRevision: !Ref GitRevision
      Layers:
        - !Ref AwsS3UtilsLayerArn
      Policies:
        - S3ReadPolicy:
            BucketName: 'shitadan'
        - S3WritePolicy:
            BucketName: 'shitadan'

Outputs:
  LambdaFunctionArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt PdfPdfToJpegFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'
