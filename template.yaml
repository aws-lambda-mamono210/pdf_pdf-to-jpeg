---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Parameters:
  LambdaLayerArn:
    Type: String
    Default: 'arn:aws:lambda:ap-northeast-1:808683561341:layer:aws-s3-utils-layer:17'
    Description: Specify the ARN of the existing Lambda Layer

Resources:

  PdfPdfToJpegFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'pdf-pdf-to-jpeg'
      Handler: 'app.lambda_function.lambda_handler'
      Runtime: 'python3.12'
      Timeout: 300
      MemorySize: 1024
      CodeUri: .
      Layers:
        - !Ref LambdaLayerArn
      Policies:
        - S3ReadPolicy:
            BucketName: 'shitadan'
        - S3WritePolicy:
            BucketName: 'shitadan'

Outputs:
  LambdaFunctionArn:
    Description: "ARN of the Lambda function"
    Value: !GetAtt PdfPdfToJpegFunction.Arn
