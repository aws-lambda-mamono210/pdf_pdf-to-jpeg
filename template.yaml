---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Globals:
  Function:
    Runtime: 'python3.12'
    Timeout: '300'
    MemorySize: '1024'

Parameters:
  AwsS3UtilsLayerArn:
    Type: String
    Description: 'ARN of aws-s3-utils-layer'

Resources:
  PdfPdfToJpegFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'pdf-pdf-to-jpeg'
      Handler: 'app.lambda_function.lambda_handler'
      CodeUri: .
      Layers:
        - !Ref AwsS3UtilsLayerArn
      Policies:
        - S3ReadPolicy:
            BucketName: 'shitadan'
        - S3WritePolicy:
            BucketName: 'shitadan'

Outputs:
  LambdaFunctionArn:
    Description: "ARN of the Lambda function"
    Value: !GetAtt PdfPdfToJpegFunction.Arn
