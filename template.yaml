---
AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Resources:
  ShitadanApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ShitadanApi
      StageName: Prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
  PdfPdfToJpegFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: 'pdf-pdf-to-jpeg'
      Handler: 'app.lambda_function.lambda_handler'
      Runtime: 'python3.9'
      Timeout: '300'
      MemorySize: '1024'
      CodeUri: .
      Layers:
        - 'arn:aws:lambda:ap-northeast-1:808683561341:layer:aws-s3-utils-layer:15'
      Policies:
        - S3ReadPolicy:
            BucketName: 'shitadan'
        - S3WritePolicy:
            BucketName: 'shitadan'
      Events:
        ConvertPdfToJpeg:
          Type: Api
          Properties:
            Path: /convert
            Method: POST
            RestApiId: !Ref ShitadanApi
Outputs:
  ApiUrl:
    Description: "API Gateway Invoke URL"
    Value: !Sub "https://${ShitadanApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/convert"
