[tool.bandit]
exclude_dirs = ['tests/unit']
include_dirs = ['app']
recursive = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".aws-sam",
    "tests/unit/layer_code",
]

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = ["E402"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"
