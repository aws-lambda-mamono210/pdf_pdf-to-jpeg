---
version: '2.1'

executors:
  bandit:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  black:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  flake8:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  isort:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  pytest:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  sam-machine:
    machine:
      image: 'ubuntu-2204:2023.10.1'
    resource_class: 'medium'
  trailing-whitespace:
    docker:
      - image: 'ghcr.io/docker-images-mamono210/circleci-executors/trailing-whitespace:latest'
    resource_class: 'small'

orbs:
  aws-cli: 'circleci/aws-cli@5.2.0'
  sam: 'circleci/aws-sam-serverless@6.1.0'
  yamllint: 'orbss/yamllint@0.0.4'

jobs:
  bandit:
    executor: 'bandit'
    steps:
      - checkout
      - run:
          name: Install bandit
          command: pip3 install bandit[toml] --user
      - run:
          name: Execute bandit
          command: bandit -c pyproject.toml -r .
          environment:
            PATH: "$PATH:/root/.local/bin"
  black:
    executor: 'black'
    steps:
      - checkout
      - run:
          name: Install black
          command: pip3 install black --user
      - run:
          name: Run black check
          command: black --check --diff .
          environment:
            PATH: "$PATH:/root/.local/bin"
  flake8:
    executor: 'flake8'
    steps:
      - checkout
      - run:
          name: Install flake8
          command: pip3 install flake8 flake8-docstrings flake8-pyproject --user
      - run:
          name: Execute flake8
          command: flake8
          environment:
            PATH: "$PATH:/root/.local/bin"
  isort:
    executor: 'isort'
    steps:
      - checkout
      - run:
          name: Install isort
          command: pip3 install isort --user
      - run:
          name: Execute isort
          command: isort --check-only --diff .
          environment:
            PATH: "$PATH:/root/.local/bin"
  pytest:
    executor: 'pytest'
    parameters:
      aws-resource-name:
        type: 'string'
    steps:
      - checkout
      - run:
          name: Install wget and unzip
          command: |
            dnf install -y wget unzip
      - aws-cli/setup:
          profile_name: 'default'
          role_arn: '${AWS_ROLE_ARN}'
          role_session_name: '<< parameters.aws-resource-name >>'
          session_duration: '900'
      - run:
          name: Install requires
          command: |
            bash tests/unit/layer_setup/download_layer.sh
            pip3 install -r requirements.txt --user
            pip3 install -r tests/requirements.txt --user
      - run:
          name: Execute unit test
          command: |
            export PYTHONPATH=$(pwd)
            export PATH=$HOME/.local/bin:'$PATH'
            pytest tests/unit/
  sam-build:
    executor: 'sam-machine'
    parameters:
      aws-resource-name:
        type: 'string'
      stack-name:
        type: 'string'
    steps:
      - checkout
      - aws-cli/setup:
          profile_name: 'default'
          role_arn: '${AWS_ROLE_ARN}'
          role_session_name: '<< parameters.aws-resource-name >>'
          session_duration: '900'
      - run:
          name: "Get latest Layer ARN"
          command: |
            LAYER_NAME="aws-s3-utils-layer"
            REGION="ap-northeast-1"

            LAYER_ARN=$(aws lambda list-layer-versions \
              --layer-name "${LAYER_NAME}" \
              --region "${REGION}" \
              --query 'LayerVersions[0].LayerVersionArn' \
              --output text)

            echo "Latest Layer ARN: ${LAYER_ARN}"
            echo "export AWS_S3_UTILS_LAYER_ARN=${LAYER_ARN}" >> $BASH_ENV
      - sam/install
      - sam/build:
          build_arguments: "--parameter-overrides AwsS3UtilsLayerArn=${AWS_S3_UTILS_LAYER_ARN}"
          template: 'template.yaml'
          use_container: true
      - run:
          name: "Plan deploy marker"
          command: |
            if [ "${CIRCLE_BRANCH}" = "main" ]; then
              ENV_NAME="PROD-PY-3.12"
            else
              ENV_NAME="STAGING-PY-3.12"
            fi

            circleci run release plan 'Update layer injection' \
              --environment-name="${ENV_NAME}" \
              --component-name='app' \
              --target-version='1.1'
      - sam/deploy:
          arguments: >-
            --no-confirm-changeset
            --parameter-overrides AwsS3UtilsLayerArn=${AWS_S3_UTILS_LAYER_ARN}
          stack_name: '<< parameters.stack-name >>'
      - run:
          name: "Update deploy marker: SUCCESS"
          command: |
            circleci run release update 'Update layer injection' \
              --status=SUCCESS
          when: on_success
      - run:
          name: "Update deploy marker: FAILED"
          command: |
            circleci run release update 'Update layer injection' \
              --status=FAILED
          when: on_fail
  yamllint:
    executor: 'yamllint/default'
    steps:
      - checkout
      - yamllint/execute
  trailing-whitespace:
    executor: 'trailing-whitespace'
    steps:
      - checkout
      - run:
          name: 'Execute trailing-whitespace'
          command: 'trailing-whitespace'

workflows:
  version: '2.1'
  build:
    jobs:
      - bandit
      - black
      - flake8
      - isort
      - yamllint
      - trailing-whitespace
      - pytest:
          aws-resource-name: 'lambda_pdf_pdf-to-jpeg'
          context: 'aws-oidc'
          requires:
            - bandit
            - black
            - flake8
            - isort
            - yamllint
            - trailing-whitespace
      - sam-build:
          aws-resource-name: 'lambda_shitadan_participant-list_sam'
          stack-name: 'lambda-function-pdf-pdf-to-jpeg'
          context: 'aws-oidc'
          requires:
            - pytest
