---
version: '2.1'

executors:
  pytest:
    docker:
      - image: 'public.ecr.aws/lambda/python:3.12'
  sam-machine:
    machine:
      image: 'ubuntu-2204:2023.10.1'
    resource_class: 'medium'
  trailing-whitespace:
    docker:
      - image: 'ghcr.io/docker-images-mamono210/circleci-executors/trailing-whitespace:latest'
    resource_class: 'small'

orbs:
  aws-cli: 'circleci/aws-cli@5.2.0'
  bandit: 'orbss/bandit@1.0.0'
  ruff: 'orbss/ruff@0.0.1'
  sam: 'circleci/aws-sam-serverless@6.1.0'
  yamllint: 'orbss/yamllint@0.0.4'

jobs:
  bandit:
    executor:
      name: bandit/default
      image: 'public.ecr.aws/lambda/python:3.12'
    steps:
      - checkout
      - bandit/install:
          extras: toml
          version: '1.9.4'
      - bandit/execute:
          config-file: 'pyproject.toml'
          targets: '.'
  ruff:
    executor:
      name: ruff/default
      image: 'public.ecr.aws/lambda/python:3.12'
    steps:
      - checkout
      - ruff/install:
          version: '0.16.2'
      - ruff/check:
          color: always
          targets: '__init__.py app tests'
      - ruff/format:
          color: always
          mode: diff
          targets: '__init__.py app tests'
  pytest:
    executor: 'pytest'
    parameters:
      aws-resource-name:
        type: 'string'
    steps:
      - checkout
      - run:
          name: Install wget and unzip
          command: |
            dnf install -y wget unzip
      - aws-cli/setup:
          profile_name: 'default'
          role_arn: '${AWS_ROLE_ARN}'
          role_session_name: '<< parameters.aws-resource-name >>'
          session_duration: '900'
      - run:
          name: Install requires
          command: |
            bash tests/unit/layer_setup/download_layer.sh
            pip3 install -r requirements.txt --user
            pip3 install -r tests/requirements.txt --user
      - run:
          name: Execute unit test
          command: |
            export PYTHONPATH=$(pwd)
            export PATH=$HOME/.local/bin:'$PATH'
            pytest tests/unit/
  sam-build:
    executor: 'sam-machine'
    parameters:
      aws-resource-name:
        type: 'string'
      layer-arn:
        type: 'string'
    steps:
      - checkout
      - run:
          name: "Decide environment and release version"
          command: |
            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! [[ "${CIRCLE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "ERROR: unsupported release tag: ${CIRCLE_TAG}"
                exit 1
              fi

              RELEASE_VERSION="${CIRCLE_TAG#v}"
              echo 'export STACK_NAME="pdf-pdf-to-jpeg-prod"' >> "$BASH_ENV"
              echo 'export FUNCTION_NAME="pdf-pdf-to-jpeg-prod"' >> "$BASH_ENV"
              echo 'export ENV_NAME="PROD-PY-3.12"' >> "$BASH_ENV"
            else
              RELEASE_VERSION="dev-${CIRCLE_SHA1:0:8}"
              echo 'export STACK_NAME="pdf-pdf-to-jpeg-stg"' >> "$BASH_ENV"
              echo 'export FUNCTION_NAME="pdf-pdf-to-jpeg-stg"' >> "$BASH_ENV"
              echo 'export ENV_NAME="STAGING-PY-3.12"' >> "$BASH_ENV"
            fi

            echo "export RELEASE_VERSION=${RELEASE_VERSION}" >> "$BASH_ENV"
            echo "export GIT_REVISION=${CIRCLE_SHA1}" >> "$BASH_ENV"
      - run:
          name: "Verify release tag is on main"
          command: |
            if [ -z "${CIRCLE_TAG:-}" ]; then
              exit 0
            fi

            git fetch origin main:refs/remotes/origin/main

            if ! git merge-base --is-ancestor "${CIRCLE_SHA1}" origin/main; then
              echo "ERROR: ${CIRCLE_TAG} does not point to a commit contained in main."
              exit 1
            fi
      - aws-cli/setup:
          profile_name: 'default'
          role_arn: '${AWS_ROLE_ARN}'
          role_session_name: '<< parameters.aws-resource-name >>'
          session_duration: '900'
      - sam/install
      - sam/build:
          build_arguments: "--parameter-overrides AwsS3UtilsLayerArn=<< parameters.layer-arn >>"
          template: 'template.yaml'
          use_container: true
      - run:
          name: "Plan deploy marker"
          command: |
            circleci run release plan 'Update release method' \
              --environment-name="${ENV_NAME}" \
              --component-name='app' \
              --target-version="${RELEASE_VERSION}"
      - sam/deploy:
          stack_name: "${STACK_NAME}"
          arguments: >-
            --no-confirm-changeset
            --parameter-overrides
            AwsS3UtilsLayerArn=<< parameters.layer-arn >>
            FunctionName=${FUNCTION_NAME}
            ReleaseVersion=${RELEASE_VERSION}
            GitRevision=${GIT_REVISION}
      - run:
          name: "Update deploy marker: SUCCESS"
          command: |
            circleci run release update 'Update release method #5210' \
              --status=SUCCESS
          when: on_success
      - run:
          name: "Update deploy marker: FAILED"
          command: |
            circleci run release update 'Update release method #5210' \
              --status=FAILED
          when: on_fail
  yamllint:
    executor: 'yamllint/default'
    steps:
      - checkout
      - yamllint/execute
  trailing-whitespace:
    executor: 'trailing-whitespace'
    steps:
      - checkout
      - run:
          name: 'Execute trailing-whitespace'
          command: 'trailing-whitespace'

workflows:
  version: '2.1'
  build:
    jobs:
      - bandit:
          filters: &build-filters |
            pipeline.git.branch
            or pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/
      - ruff:
          filters: *build-filters
      - yamllint:
          filters: *build-filters
      - trailing-whitespace:
          filters: *build-filters
      - pytest:
          aws-resource-name: 'lambda_pdf_pdf-to-jpeg'
          context: 'aws-oidc'
          requires:
            - bandit
            - ruff
            - yamllint
            - trailing-whitespace
          filters: *build-filters
      - sam-build:
          aws-resource-name: 'lambda_shitadan_participant-list_sam'
          layer-arn: 'arn:aws:lambda:ap-northeast-1:808683561341:layer:aws-s3-utils-layer-prod:1'
          context: 'aws-oidc'
          requires:
            - pytest
          filters: *build-filters
